[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ular-cyber-roguelite"
version = "0.5.0"
description = "Playtested Pygame snake vertical slice with cybernetic modules, hazards, rewards, and handoff docs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
