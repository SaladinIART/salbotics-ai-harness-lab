[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ular-cyber-roguelite"
version = "0.6.0"
description = "Pygame snake vertical slice with speed tuning, developer mode, boss fixes, and roguelite systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
