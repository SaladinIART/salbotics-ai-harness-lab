[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ular-retro-engine"
version = "0.1.0"
description = "Pyxel-based retro engine scaffold for Ular."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyxel"]

[tool.setuptools.packages.find]
where = ["src"]
